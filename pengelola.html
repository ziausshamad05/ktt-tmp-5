  function row(l,t,ok,txt){return el('div',{class:'st'},el('div',null,el('b',{text:l}),el('small',{text:t})),tag(txt,ok===true?'good':ok===false?'crit':'warn'))}
  var live=p&&!p.err&&p.live,L={ok:['Berfungsi',true],kunci_ditolak:['Kunci ditolak',false],kredit_habis:['Kredit habis',false],rate_limited:['Terlalu sibuk',null],tanpa_kunci:['Kunci belum dipasang',false],tak_terjangkau:['Tidak terjangkau',false]};
  var ai=el('div',{class:'paket'},el('h3',{text:'Sambungan AI (ClassAI)'}));
  if(p&&p.err)ai.append(el('p',{class:'err',text:p.err}));
  else if(p){var l=L[p.live]||['Galat '+(p.status||''),false];
    ai.append(row('Server AI',(p.base||'router.classai.id/v1')+' · model '+(p.model||'')+' / '+(p.cepat||''),true,'Terpasang'),
      row('Kunci dan kredit',p.live==='ok'?'Permintaan uji berhasil dalam '+p.ms+' ms':(p.galat||'Lihat keterangan status di kanan'),l[1],l[0]));
  }else ai.append(el('p',{class:'sub',text:'Klik Uji koneksi AI untuk mengirim satu permintaan sangat kecil ke router.classai.id dengan kunci yang tersimpan di server, dan melihat apakah kunci dan kreditnya berfungsi.'}));
  var chk=el('button',{type:'button',class:'btn pri'},'Uji koneksi AI');
  chk.addEventListener('click',async function(){
    chk.disabled=true;chk.textContent='Menguji…';var out={err:''};
    try{var b=await S.sb.functions.invoke('ai-proxy',{body:{ping:true,live:true}});
      if(b.error)out.err='Fungsi ai-proxy tidak dapat dijangkau atau belum versi terbaru.';else Object.assign(out,b.data||{})}catch(e){out.err='Tidak dapat menjangkau fungsi server.'}
    S.ping=out;render()});
  ai.append(el('div',{class:'acts',style:'margin-top:10px'},chk),el('p',{class:'sub',style:'margin:10px 0 0',text:'Kunci disimpan sebagai CLASSAI_API_KEY di Supabase (Edge Functions, Secrets). Kunci tidak pernah tampil di aplikasi. Batas pakai harian per perusahaan 60 permintaan, atur dengan AI_DAILY_LIMIT.'}));
  box.append(ai);
  return el('section',{class:'sec'},el('h2',{text:'Pembayaran dan AI'}),el('p',{class:'sub',text:'Pengaturan QRIS penerimaan dan pemeriksaan sambungan AI.'}),box);
}

/* ---------- mulai ---------- */
setInterval(async function(){
  if(!S.loaded||S.loading||document.visibilityState!=='visible')return;
  if(S.tab!=='chat'&&S.tab!=='kredit')return;
  var foc=S._ta&&document.activeElement===S._ta,v=foc?S._ta.value:null;
  await loadChat();render();
  if(foc){S._ta.focus();S._ta.setSelectionRange(S._ta.value.length,S._ta.value.length)}
},6000);
function idle(){setInterval(function(){if($('#body')&&Date.now()-S.last>60*60*1000){keluar();toast('Sesi berakhir karena tidak ada aktivitas')}},30000);
  ['click','keydown','pointerdown'].forEach(function(ev){document.addEventListener(ev,function(){S.last=Date.now()},true)})}
function start(){
  if(!CFG||!window.supabase||!window.supabase.createClient){$('#app').append(el('p',{class:'empty',text:'Pustaka masuk gagal dimuat. Muat ulang halaman.'}));return}
  var store;try{store=window.sessionStorage;store.getItem('x')}catch(e){store=undefined}
  S.sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:!!store,autoRefreshToken:true,detectSessionInUrl:false,storage:store,storageKey:'ktt-pengelola-auth'}});
  idle();
  var hs=location.hash.replace(/^#/,''),hp=new URLSearchParams(hs);
  if(hp.get('access_token')&&hp.get('refresh_token')){
    history.replaceState(null,'',location.pathname);
    S.sb.auth.setSession({access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token')}).then(async function(r){
      if(r.error||!r.data||!r.data.session){viewGate('Tautan tidak valid atau sudah kedaluwarsa. Minta tautan baru.');return}
      var op=await S.sb.rpc('ktt_is_operator');
      if(op.error||op.data!==true){await S.sb.auth.signOut();viewGate('Akun ini bukan pengelola.');return}
      viewGate('','atur',{email:r.data.session.user.email||'',sesi:true});
    }).catch(function(){viewGate('Tautan tidak valid atau sudah kedaluwarsa. Minta tautan baru.')});
    return;
  }
  if(hp.get('error_description')){history.replaceState(null,'',location.pathname);viewGate('Tautan sudah kedaluwarsa atau tidak valid. Minta email baru lewat Lupa kata sandi.');return}
  S.sb.auth.getSession().then(function(r){if(r&&r.data&&r.data.session)enter();else viewGate('')}).catch(function(){viewGate('')});
}
start();
})();
</script>
